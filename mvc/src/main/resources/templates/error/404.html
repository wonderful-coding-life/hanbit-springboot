<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>404 - 페이지를 찾을 수 없습니다</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px 20px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .message {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .sub-message {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #fff;
            color: #333;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #f1f1f1;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="error-code">404</div>
    <div class="message">페이지를 찾을 수 없습니다</div>
    <div class="sub-message">
        요청하신 페이지가 존재하지 않거나 이동되었을 수 있습니다.
    </div>

    <a href="/" class="btn">홈으로 이동</a>

    <div class="footer">
        © Your Service
    </div>
</div>
</body>
</html>
