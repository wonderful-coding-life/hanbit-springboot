<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>오류 발생</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #ff7e5f, #feb47b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 30px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .status {
      font-size: 72px;
      font-weight: 700;
      color: #ff5e57;
      margin-bottom: 10px;
    }

    .error {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .message {
      font-size: 15px;
      color: #666;
      margin-bottom: 20px;
    }

    .info {
      background: #f7f7f7;
      border-radius: 10px;
      padding: 15px;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .info div {
      margin-bottom: 6px;
    }

    .label {
      font-weight: 600;
      color: #333;
    }

    .value {
      color: #555;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 25px;
      background: #333;
      color: #fff;
      text-decoration: none;
      transition: 0.2s;
    }

    .btn:hover {
      background: #000;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- 상태 코드 -->
  <div class="status" th:text="${status}">500</div>

  <!-- 에러 이름 -->
  <div class="error" th:text="${error}">Internal Server Error</div>

  <!-- 메시지 -->
  <div class="message" th:text="${message}">
    요청 처리 중 오류가 발생했습니다.
  </div>

  <!-- 상세 정보 -->
  <div class="info">
    <div>
      <span class="label">요청 경로:</span>
      <span class="value" th:text="${path}">/example</span>
    </div>
  </div>

  <!-- 홈 버튼 -->
  <a href="/" class="btn">홈으로 이동</a>

  <div class="footer">
    © Your Service
  </div>
</div>

</body>
</html>
